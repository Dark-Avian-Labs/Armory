name: Armory PR Checks

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 26

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@v1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies (fresh lockfile)
        uses: ./.github/actions/pnpm-install-fresh

      - name: Check formatting
        run: pnpm run check-format

      - name: Check linting
        run: pnpm run lint

      - name: Check types
        run: pnpm run typecheck

      - name: Build project
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Test coverage report
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
